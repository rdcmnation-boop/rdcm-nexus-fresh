<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDCM NATION - Nexus Gaming</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #050810 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app { display: flex; flex-direction: column; height: 100vh; }

        .header {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4a 100%);
            padding: 20px;
            border-bottom: 2px solid #FF6B9D;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            background: linear-gradient(45deg, #FF6B9D, #00D9FF, #B000FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p { color: #00D9FF; font-size: 0.9em; }

        .nav {
            display: flex;
            gap: 0;
            background: rgba(10, 14, 39, 0.9);
            border-bottom: 2px solid rgba(255, 107, 157, 0.3);
            overflow-x: auto;
        }

        .nav-btn {
            flex-shrink: 0;
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .nav-btn:hover { color: #FF6B9D; }
        .nav-btn.active { color: #FF6B9D; border-bottom-color: #FF6B9D; }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .game-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 107, 157, 0.05);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 107, 157, 0.2);
        }

        .game-container h2 {
            margin-bottom: 20px;
            color: #FF6B9D;
        }

        .stat-box {
            display: inline-block;
            background: rgba(0, 217, 255, 0.1);
            padding: 15px 20px;
            margin: 10px 5px;
            border-radius: 8px;
            border: 1px solid #00D9FF;
            text-align: center;
        }

        .stat-label { font-size: 0.8em; opacity: 0.7; }
        .stat-value { font-size: 1.5em; font-weight: bold; color: #00D9FF; }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            margin: 10px 5px;
            background: linear-gradient(45deg, #FF6B9D, #B000FF);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 107, 157, 0.5); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .footer {
            background: linear-gradient(to right, #050810, #0a0e27);
            padding: 10px;
            text-align: center;
            font-size: 0.85em;
            border-top: 1px solid rgba(255, 107, 157, 0.2);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>🎮 RDCM NATION</h1>
            <p>Nexus Gaming Hub 3036 | Balance: <span id="balance">5000</span> NEXUS</p>
        </div>

        <div class="nav">
            <button class="nav-btn active" onclick="switchGame('mining')">⛏️ Mining</button>
            <button class="nav-btn" onclick="switchGame('blackjack')">♠️ Blackjack</button>
            <button class="nav-btn" onclick="switchGame('crash')">📈 Crash</button>
            <button class="nav-btn" onclick="switchGame('dice')">🎲 Dice</button>
            <button class="nav-btn" onclick="switchGame('arena')">⚔️ Arena</button>
        </div>

        <div class="content">
            <div id="game-content"></div>
        </div>

        <div class="footer">
            <p>© 2026 RDCM NATION | Firebase + Netlify | Easy Backend Connection</p>
        </div>
    </div>

    <script src="../src/games.js"></script>
    <script src="../src/api.js"></script>
</body>
</html>
